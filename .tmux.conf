# ==========================================================
# tmux Configuration
# ==========================================================

# ----------------------------------------------------------
# General
# ----------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g history-limit 50000
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
# Disable mouse in VS Code (conflicts with its own mouse handling)
if-shell '[ "$TERM_PROGRAM" = "vscode" ]' 'set -g mouse off' 'set -g mouse on'
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on

# ----------------------------------------------------------
# Key Bindings
# ----------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "Config reloaded."

# Pane splitting (keep current path)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ----------------------------------------------------------
# Copy mode (vi keys)
# ----------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ----------------------------------------------------------
# Status Bar (Powerline style)
# ----------------------------------------------------------
set -g status-justify centre
set -g status-bg colour235
set -g status-fg white
set -g status-interval 5

# Left: session
set -g status-left-length 40
set -g status-left '#[fg=colour235,bg=blue,bold]  #S #[fg=blue,bg=colour235]'

# Right: date time
set -g status-right-length 40
set -g status-right '#[fg=green,bg=colour235]#[fg=colour235,bg=green,bold] %m/%d %H:%M '

# Active window
set-window-option -g window-status-current-format '#[fg=colour235,bg=cyan]#[fg=colour235,bg=cyan,bold] #I #W #[fg=cyan,bg=colour235]'

# Inactive window
set-window-option -g window-status-format '#[fg=colour250] #I #W '

# Pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=cyan

setw -g automatic-rename on
